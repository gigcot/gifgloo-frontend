name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE: https://api.example.com
      NEXT_PUBLIC_APP_URL: https://example.com
      NEXT_PUBLIC_PORTONE_STORE_ID: store-test
      NEXT_PUBLIC_PORTONE_CHANNEL_KEY: channel-key-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: env
    concurrency:
      group: gifgloo-frontend-production
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_PORTONE_STORE_ID: ${{ vars.NEXT_PUBLIC_PORTONE_STORE_ID }}
      NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${{ vars.NEXT_PUBLIC_PORTONE_CHANNEL_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate production configuration
        run: |
          test -n "$NEXT_PUBLIC_API_BASE"
          test -n "$NEXT_PUBLIC_APP_URL"
          test -n "$NEXT_PUBLIC_PORTONE_STORE_ID"
          test -n "$NEXT_PUBLIC_PORTONE_CHANNEL_KEY"

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Package build artifacts
        run: |
          mkdir -p release/.next
          cp -R .next/standalone/. release/
          cp -R .next/static release/.next/static
          cp -R public release/public
          cp ecosystem.config.js release/ecosystem.config.js
          tar -czf "frontend-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}.tar.gz" -C release .

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          ADMIN_PANEL_PATH: ${{ secrets.ADMIN_PANEL_PATH }}
        run: |
          test -n "$SSH_KEY"
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$KLIPY_API_KEY"

          RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          ARCHIVE="frontend-${RELEASE_ID}.tar.gz"
          RUNTIME_ENV=$(printf 'KLIPY_API_KEY=%s\nADMIN_PANEL_PATH=%s\nAPP_REVISION=%s\n' "$KLIPY_API_KEY" "$ADMIN_PANEL_PATH" "$GITHUB_SHA" | base64 -w 0)

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/deploy_key "$ARCHIVE" "$EC2_USER@$EC2_HOST:/tmp/$ARCHIVE"

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << DEPLOY
            set -Eeuo pipefail

            mkdir -p ~/gifgloo-frontend
            cd ~/gifgloo-frontend
            APP_DIR="\$(pwd -P)"
            RELEASES_DIR="\$APP_DIR/releases"
            RELEASE_DIR="\$RELEASES_DIR/$RELEASE_ID"
            CURRENT_LINK="\$APP_DIR/current"
            NEXT_LINK="\$APP_DIR/.current-$RELEASE_ID"
            ROLLBACK_LINK="\$APP_DIR/.rollback-$RELEASE_ID"
            PREVIOUS_RELEASE=""
            PREVIOUS_REVISION=""

            if [ -L "\$CURRENT_LINK" ]; then
              PREVIOUS_RELEASE="\$(readlink -f "\$CURRENT_LINK")"
              if [ -f "\$PREVIOUS_RELEASE/.env" ]; then
                PREVIOUS_REVISION="\$(sed -n 's/^APP_REVISION=//p' "\$PREVIOUS_RELEASE/.env")"
              fi
            fi

            activate_release() {
              revision="\$1"
              pm2_state="\$(pm2 jlist | node -e '
                let input = "";
                process.stdin.on("data", (chunk) => input += chunk);
                process.stdin.on("end", () => {
                  const app = JSON.parse(input).find((item) => item.name === "gifgloo-frontend");
                  if (app) process.stdout.write(app.pm2_env.exec_mode + "\t" + app.pm2_env.pm_exec_path);
                });
              ')"

              if [ -z "\$pm2_state" ]; then
                APP_REVISION="\$revision" pm2 start "\$APP_DIR/ecosystem.config.js" --env production --update-env
                return
              fi

              IFS=\$'\t' read -r pm2_mode pm2_script <<< "\$pm2_state"
              if [ "\$pm2_mode" != "cluster_mode" ] || [ "\$pm2_script" != "\$CURRENT_LINK/server.js" ]; then
                pm2 delete gifgloo-frontend
                APP_REVISION="\$revision" pm2 start "\$APP_DIR/ecosystem.config.js" --env production --update-env
                return
              fi

              APP_REVISION="\$revision" pm2 reload "\$APP_DIR/ecosystem.config.js" --env production --update-env
            }

            verify_revision() {
              expected_revision="\$1"
              actual_revision=""

              for attempt in {1..10}; do
                if health_response="\$(curl --fail --silent --show-error http://127.0.0.1:3000/api/health)"; then
                  if actual_revision="\$(printf '%s' "\$health_response" | node -e '
                    let input = "";
                    process.stdin.on("data", (chunk) => input += chunk);
                    process.stdin.on("end", () => process.stdout.write(JSON.parse(input).revision));
                  ')" && [ "\$actual_revision" = "\$expected_revision" ]; then
                    return
                  fi
                fi
                sleep 2
              done

              echo "Expected revision \$expected_revision, got \${actual_revision:-no response}" >&2
              return 1
            }

            rollback() {
              status=\$?
              trap - ERR
              if [ -n "\$PREVIOUS_RELEASE" ] && [ -d "\$PREVIOUS_RELEASE" ]; then
                ln -s "\$PREVIOUS_RELEASE" "\$ROLLBACK_LINK"
                mv -Tf "\$ROLLBACK_LINK" "\$CURRENT_LINK"
                activate_release "\$PREVIOUS_REVISION"
                pm2 save
              fi
              exit "\$status"
            }
            trap rollback ERR

            mkdir -p "\$RELEASES_DIR"
            mkdir "\$RELEASE_DIR"
            tar -xzf "/tmp/$ARCHIVE" -C "\$RELEASE_DIR"
            printf '%s' "$RUNTIME_ENV" | base64 --decode > "\$RELEASE_DIR/.env"
            chmod 600 "\$RELEASE_DIR/.env"
            cp "\$RELEASE_DIR/ecosystem.config.js" "\$APP_DIR/ecosystem.config.js"

            ln -s "\$RELEASE_DIR" "\$NEXT_LINK"
            mv -Tf "\$NEXT_LINK" "\$CURRENT_LINK"

            activate_release "$GITHUB_SHA"
            verify_revision "$GITHUB_SHA"
            pm2 save

            trap - ERR
            rm "/tmp/$ARCHIVE"

            find "\$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -nr \
              | tail -n +6 \
              | cut -d' ' -f2- \
              | while IFS= read -r old_release; do
                  if [ "\$old_release" != "\$(readlink -f "\$CURRENT_LINK")" ]; then
                    rm -rf -- "\$old_release"
                  fi
                done
          DEPLOY
